name: Test Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker buildx build \
            -f Dockerfile.safe \
            -t quantum-trader-safe:test \
            --load \
            .
      
      - name: Start services
        run: |
          mkdir -p data logs backups audit strategies config
          chmod a+rwx data logs backups audit
          export R20_SETUP_TOKEN="ci$(openssl rand -hex 24)"
          docker compose -f docker-compose.safe.yml up -d --build
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/v1/health && break
            sleep 2
          done
      
      - name: Check container health
        run: |
          docker compose -f docker-compose.safe.yml ps
          docker inspect r20-quantum-trader-safe
      
      - name: Test API endpoint
        run: |
          curl -f http://localhost:8080/api/v1/health || exit 1
          echo "✅ API is responding"
      
      - name: Check logs
        if: always()
        run: |
          docker compose -f docker-compose.safe.yml logs
      
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.safe.yml down -v

  safety-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run safety validator
        run: |
          R20_SETUP_TOKEN="$(openssl rand -hex 32)" python scripts/safety_validator.py
        env:
          TRADING_MODE: backtest
          DRY_RUN: "1"
          STRATEGY_VALIDATION: "1"
          AUDIT_LOG_PATH: ${{ runner.temp }}/audit
