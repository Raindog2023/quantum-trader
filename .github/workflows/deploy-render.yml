name: Build & Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.safe'
      - 'docker-compose.safe.yml'
      - 'r20_backend/**'
      - 'r20_gateway/**'
      - 'dashboard/**'
      - 'scripts/**'
      - '.github/workflows/deploy-render.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker buildx build \
            -f Dockerfile.safe \
            -t quantum-trader-safe:latest \
            -t quantum-trader-safe:${GITHUB_SHA::8} \
            --load \
            .
      
      - name: Test container startup
        run: |
          docker-compose -f docker-compose.safe.yml up -d
          sleep 10
          curl -f http://localhost:8080/api/v1/health || exit 1
          docker-compose -f docker-compose.safe.yml down
      
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "clearCache": false
              }'
            echo "Render deployment triggered"
          else
            echo "Render secrets not configured, skipping deployment"
          fi
      
      - name: Notify on success
        if: success()
        run: echo "✅ Build and deployment successful"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Build or deployment failed"
          exit 1
