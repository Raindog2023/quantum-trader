name: Security Scan & Hardening

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  # Security Scanning
  security-scan:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'quantum-trader-r20-quantum-trader-safe:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Trivy'
      
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.hardened
          ignore: DL3008,DL3009
          failure-threshold: warning

  # Configuration Audit
  config-audit:
    name: Audit Docker Configuration
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for security issues in compose files
        run: |
          echo "Checking for security issues..."
          
          # Check for root user
          if grep -q "USER root" docker-compose.yml; then
            echo "⚠️  WARNING: Compose file contains USER root"
            exit 1
          fi
          
          # Check for privileged mode
          if grep -q "privileged: true" docker-compose.yml; then
            echo "⚠️  WARNING: Privileged mode enabled"
            exit 1
          fi
          
          # Check for 0.0.0.0 ports
          if grep -q "0.0.0.0" docker-compose.yml; then
            echo "⚠️  INFO: Ports exposed to 0.0.0.0 (consider restricting)"
          fi
          
          echo "✅ Configuration checks passed"

  # Build & Test
  build-secure:
    name: Build Hardened Image
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build hardened image
        run: |
          docker buildx build \
            -f Dockerfile.hardened \
            -t quantum-trader-hardened:latest \
            --load \
            .
      
      - name: Test image
        run: |
          # Start container
          docker run -d --name test-quantum \
            -e TRADING_MODE=backtest \
            -e DRY_RUN=1 \
            quantum-trader-hardened:latest
          
          # Wait for health
          sleep 5
          
          # Check health
          docker exec test-quantum curl -f http://localhost:8080/api/v1/health || exit 1
          
          # Cleanup
          docker stop test-quantum
          docker rm test-quantum
          
          echo "✅ Image test passed"
      
      - name: Scan with Grype
        uses: anchore/scan-action@v3
        with:
          image: quantum-trader-hardened:latest
          fail-build: false
          severity-cutoff: high
